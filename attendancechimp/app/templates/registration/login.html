<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - AttendanceChimp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #172234;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: min(88%, 420px);
            padding: 2.5rem;
            border-radius: 18px;
            background: white;
            box-shadow: 0 18px 50px rgba(35, 55, 85, 0.14);
        }
        h1 { margin-top: 0; text-align: center; color: #194b7a; }
        label { display: block; margin-top: 1rem; font-weight: 700; }
        input {
            box-sizing: border-box;
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.75rem;
            border: 1px solid #9aabc0;
            border-radius: 8px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.8rem;
            border: 0;
            border-radius: 9px;
            background: #2367a5;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .errorlist { color: #a01919; }
        .help { text-align: center; }
    </style>
</head>
<body>
<main>
    <h1>Log in</h1>
    {% if form.errors %}
        <p class="errorlist">The username or password was not recognized.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Log In</button>
    </form>
    <p class="help"><a href="{% url 'new_user' %}">Create an account</a></p>
</main>
</body>
</html>
