<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Lecture - AttendanceChimp</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172234; font-family: Arial, Helvetica, sans-serif; }
        main { box-sizing: border-box; width: min(90%, 520px); padding: 2.5rem; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(35, 55, 85, .14); }
        h1 { margin-top: 0; text-align: center; color: #194b7a; }
        p { color: #52677f; text-align: center; }
        label { display: block; margin-top: 1rem; font-weight: 700; }
        select { box-sizing: border-box; width: 100%; margin: .5rem 0 1.25rem; padding: .75rem; border: 1px solid #9aabc0; border-radius: 8px; background: #fff; font: inherit; }
        button { width: 100%; padding: .8rem; border: 0; border-radius: 9px; background: #2367a5; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .back { display: block; margin-top: 1.2rem; text-align: center; }
    </style>
</head>
<body>
<main>
    <h1>Start a lecture</h1>
    <p>The lecture timestamp is recorded when this form is submitted.</p>
    <form method="post" action="/app/createLecture/">
        {% csrf_token %}
        <label for="choice">Course</label>
        <select id="choice" name="choice" required>
            <option value="" selected disabled>Select a course</option>
            {% for course in courses %}
                <option value="{{ course.name }}">{{ course.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Create Lecture</button>
    </form>
    <a class="back" href="/">Back to AttendanceChimp</a>
</main>
</body>
</html>
