<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Course - AttendanceChimp</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172234; font-family: Arial, Helvetica, sans-serif; }
        main { box-sizing: border-box; width: min(90%, 560px); padding: 2.5rem; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(35, 55, 85, .14); }
        h1 { margin-top: 0; text-align: center; color: #194b7a; }
        p { color: #52677f; text-align: center; }
        label { display: block; margin-top: 1rem; font-weight: 700; }
        input[type="text"], input[type="time"] { box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .75rem; border: 1px solid #9aabc0; border-radius: 8px; font: inherit; }
        fieldset { margin: 1.2rem 0; padding: 1rem; border: 1px solid #c6d1df; border-radius: 8px; }
        fieldset label { display: inline-block; margin: .4rem .8rem .4rem 0; font-weight: 400; }
        button { width: 100%; padding: .8rem; border: 0; border-radius: 9px; background: #2367a5; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .back { display: block; margin-top: 1.2rem; text-align: center; }
    </style>
</head>
<body>
<main>
    <h1>Create a course</h1>
    <p>Instructor access is required to save a course.</p>
    <form method="post" action="/app/createCourse/">
        {% csrf_token %}

        <label for="course-name">Course name</label>
        <input id="course-name" name="course-name" type="text" required>

        <label for="start-time">Start time</label>
        <input id="start-time" name="start-time" type="time" required>

        <label for="end-time">End time</label>
        <input id="end-time" name="end-time" type="time" required>

        <fieldset>
            <legend>Meeting days</legend>
            <input id="day-mon" name="day-mon" type="checkbox" value="1">
            <label for="day-mon">Monday</label>
            <input id="day-tue" name="day-tue" type="checkbox" value="1">
            <label for="day-tue">Tuesday</label>
            <input id="day-wed" name="day-wed" type="checkbox" value="1">
            <label for="day-wed">Wednesday</label>
            <input id="day-thu" name="day-thu" type="checkbox" value="1">
            <label for="day-thu">Thursday</label>
            <input id="day-fri" name="day-fri" type="checkbox" value="1">
            <label for="day-fri">Friday</label>
        </fieldset>

        <button type="submit">Create Course</button>
    </form>
    <a class="back" href="/">Back to AttendanceChimp</a>
</main>
</body>
</html>
