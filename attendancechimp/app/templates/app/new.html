<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - AttendanceChimp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #172234;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: min(88%, 480px);
            padding: 2.5rem;
            border-radius: 18px;
            background: white;
            box-shadow: 0 18px 50px rgba(35, 55, 85, 0.14);
        }
        h1 { margin-top: 0; text-align: center; color: #194b7a; }
        label { display: block; margin-top: 1rem; font-weight: 700; }
        input[type="text"], input[type="email"], input[type="password"] {
            box-sizing: border-box;
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.75rem;
            border: 1px solid #9aabc0;
            border-radius: 8px;
            font: inherit;
        }
        fieldset { margin: 1.2rem 0; border: 1px solid #c6d1df; border-radius: 8px; }
        fieldset label { display: inline; margin-right: 1rem; font-weight: 400; }
        button {
            width: 100%;
            padding: 0.8rem;
            border: 0;
            border-radius: 9px;
            background: #2367a5;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        p { text-align: center; }
    </style>
</head>
<body>
<main>
    <h1>Create your account</h1>
    <form method="post" action="/app/createUser">
        {% csrf_token %}

        <label for="user_name">User name</label>
        <input id="user_name" name="user_name" type="text" required autocomplete="username">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password">

        <fieldset>
            <legend>Role</legend>
            <input id="student" name="is_student" type="radio" value="1" required>
            <label for="student">Student</label>
            <input id="instructor" name="is_student" type="radio" value="0">
            <label for="instructor">Instructor</label>
        </fieldset>

        <button type="submit">Sign Up</button>
    </form>
    <p><a href="{% url 'login' %}">Already registered? Log in.</a></p>
</main>
</body>
</html>
